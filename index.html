<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Oooh+Baby&family=Rubik+Maze&display=swap"
        rel="stylesheet">
    <title>Tặng Dì iuuuuu💖</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.14/dist/dotlottie-wc.js" type="module"></script>
    <style>
        .oooh-baby-regular {
            font-family: "Oooh Baby", cursive;
            font-weight: 400;
            font-style: normal;
        }


        .rubik-maze-regular {
            font-family: "Rubik Maze", system-ui;
            font-weight: 400;
            font-style: normal;
        }

        .lobster-regular {
            font-family: "Lobster", sans-serif;
            font-weight: 400;
            font-style: normal;
        }


        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calendar {
            background-color: white;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            height: 100%;
        }

        .calendar-header {
            background-color: #ffffff;
            color: #333;
            text-align: center;
            padding: 24px 20px;
            font-size: 1.5em;
            font-weight: 700;
            border-bottom: 2px solid #f0f0f0;
            letter-spacing: 1px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            padding: 20px;
            gap: 8px;
            text-align: center;
        }

        .day-name {
            font-weight: 600;
            color: #a0a0a0;
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .day {
            position: relative;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            color: #444;
            font-size: 1em;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .day:not(.empty):not(.heart-date):hover {
            background-color: #f0f4f8;
            cursor: pointer;
        }

        /* Special styling for the 8th */
        .heart-date {
            color: white;
            font-weight: 700;
        }

        .heart-icon {
            position: absolute;
            width: 48px;
            height: 48px;
            fill: #e74c3c;
            /* Red color */
            z-index: 0;
            top: 50%;
            left: 50%;
            /* Slight vertical adjustment to center the number visually inside the heart */
            transform: translate(-50%, -48%);
        }

        .heart-date span {
            position: relative;
            z-index: 1;
        }
    </style>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @property --bg-grad-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes rotate-gradient {
            0% {
                --bg-grad-angle: 0deg;
            }

            100% {
                --bg-grad-angle: 360deg;
            }
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;

            background: linear-gradient(var(--bg-grad-angle),
                    #ffd6e7,
                    #fbf6f8,
                    #ffffff);

            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: rotate-gradient 5s linear infinite;
        }

        /* sao lấp lánh */

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
            display: none;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.8);
            }

            100% {
                opacity: 0.2;
                transform: scale(1);
            }
        }

        /* tim bay */

        .heart {
            position: absolute;
            bottom: -20px;
            font-size: 20px;
            animation: floatHeart linear infinite;
            opacity: 0.7;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* card */

        .card {

            width: 850px;
            max-width: 95%;

            background: url('glass.png');
            background-size: cover;
            background-color: rgba(255, 255, 255, 0.25);
            background-blend-mode: overlay;

            border: 3px solid rgba(255, 255, 255, 0.7);

            border-radius: 35px;

            padding: 40px;

            text-align: center;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.7);

            animation: floatCard 4s ease-in-out infinite;

            position: relative;
            z-index: 10;
        }

        @keyframes floatCard {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }
        }

        .badge {
            font-size: 70px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
            display: none;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        h1 {
            font-size: 58px;
            color: #ed0202;
            margin-bottom: 15px;
            text-shadow: 0 0 1px rgb(45 39 39 / 90%);
        }

        .subtitle {
            font-size: 35px;
            color: #ed0202;
            margin-bottom: 25px;
            line-height: 1.7;
        }

        /* ảnh */

        .photo-box {
            margin: 25px auto;
        }

        .photo-box img {

            width: 260px;
            height: 260px;

            object-fit: cover;

            border-radius: 25px;

            border: 8px solid white;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15);

            animation: photoFloat 3s ease-in-out infinite;
        }

        @keyframes photoFloat {
            0% {
                transform: rotate(-2deg);
            }

            50% {
                transform: rotate(2deg);
            }

            100% {
                transform: rotate(-2deg);
            }
        }

        /* lời chúc */

        .message {
            margin-top: 25px;

            font-size: 24px;

            color: #ff4f93;

            font-weight: bold;

            min-height: 60px;
        }

        /* button */

        .btn {

            display: inline-block;

            margin-top: 30px;

            padding: 14px 35px;

            border-radius: 50px;

            background: #ff7eb6;

            color: white;

            text-decoration: none;

            font-size: 20px;

            transition: 0.3s;

            box-shadow:
                0 5px 15px rgba(255, 126, 182, 0.5);
        }

        .btn:hover {
            transform: scale(1.08);
        }

        /* nhạc */

        .music {
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        /* mobile */

        @media(max-width:768px) {

            h1 {
                font-size: 42px;
            }

            .subtitle {
                font-size: 18px;
            }

            .message {
                font-size: 20px;
            }

            .photo-box img {
                width: 220px;
                height: 220px;
            }
        }

        #calendar-container {
            width: 45%;
        }

        @media only screen and (max-width: 600px) {
            #calendar-container {
                width: 100%;
                height: 70%;
            }
        }
    </style>
</head>

<body>
    <dotlottie-wc id="gift-animation" src="gift.lottie" style="width: 700px; height: 700px; cursor: pointer; ">
    </dotlottie-wc>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const player = document.getElementById('gift-animation');

            player.addEventListener('click', () => {
                // Make sure the internal animation engine is ready
                if (player.dotLottie) {
                    setTimeout(() => {
                        document.getElementById('gift-animation').style.display = 'none'
                        document.getElementById('main-card').style.display = 'block'

                        incrOpacity = setInterval(() => {
                            mainCard = document.getElementById('main-card')
                            if (mainCard.style.opacity !== '1') {
                                mainCard.style.opacity = Number(mainCard.style.opacity) + 0.05
                            }
                            else {
                                clearInterval(incrOpacity)
                            }
                        }, 50)

                        document.getElementById('calendar-container').style.display = 'block'

                        const audio = document.getElementById('hpbd-audio');

                        // Unmute and play when mouse enters
                        audio.muted = false;
                        audio.play().catch(error => {
                            console.log("Playback prevented until a click happens:", error);
                        });

                        setTimeout(() => {
                            decrOpacity = setInterval(() => {
                                mainCard = document.getElementById('calendar-container')
                                if (mainCard.style.opacity !== '0') {
                                    mainCard.style.opacity = Number(mainCard.style.opacity) - 0.05
                                }
                                else {
                                    clearInterval(decrOpacity)
                                    document.getElementById('calendar-container').style.display = 'none'
                                    document.getElementById('main-card-content').style.visibility = 'visible'

                                    incrOpacity = setInterval(() => {
                                        mainCard = document.getElementById('main-card-content')
                                        if (mainCard.style.opacity !== '1') {
                                            mainCard.style.opacity = Number(mainCard.style.opacity) + 0.05
                                        }
                                        else {
                                            clearInterval(incrOpacity)
                                        }
                                    }, 50)
                                }
                            }, 50)

                        }, 2000)
                    }, 2000);

                    // 1. Reset back to the very first frame
                    player.dotLottie.setFrame(0);

                    // 2. Play the animation
                    player.dotLottie.play();
                }
            });
        });
    </script>
    <!-- card -->

    <div class="card" id="main-card" style="display: none; opacity: 0; height: 90vh;">

        <div id="main-card-header">
            <div class="badge">🎓</div>

            <h1 class="lobster-regular">Chúc Mừng Sinh Nhật</h1>
            <div class="subtitle rubik-maze-regular">
                ❤️DÌIU - TRÚC LAN💖
            </div>
        </div>
        <div id="calendar-container" style="display: none; opacity: 1; margin: 0 auto;">
            <div class="calendar" id="calendar-inner" style="margin: 0 auto;">
                <div class="calendar-header">
                    August 2026
                </div>

                <div class="calendar-grid">
                    <!-- Days of the week -->
                    <div class="day-name">Sun</div>
                    <div class="day-name">Mon</div>
                    <div class="day-name">Tue</div>
                    <div class="day-name">Wed</div>
                    <div class="day-name">Thu</div>
                    <div class="day-name">Fri</div>
                    <div class="day-name">Sat</div>

                    <!-- Empty slots for the days before August 1st (August 2026 starts on a Saturday) -->
                    <div class="day empty"></div>
                    <div class="day empty"></div>
                    <div class="day empty"></div>
                    <div class="day empty"></div>
                    <div class="day empty"></div>
                    <div class="day empty"></div>

                    <!-- August Dates -->
                    <div class="day">1</div>
                    <div class="day">2</div>
                    <div class="day">3</div>
                    <div class="day">4</div>
                    <div class="day">5</div>
                    <div class="day">6</div>
                    <div class="day">7</div>

                    <!-- August 8th with the Red Heart -->
                    <div class="day heart-date">
                        <svg class="heart-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                        </svg>
                        <span>8</span>
                    </div>

                    <div class="day">9</div>
                    <div class="day">10</div>
                    <div class="day">11</div>
                    <div class="day">12</div>
                    <div class="day">13</div>
                    <div class="day">14</div>
                    <div class="day">15</div>
                    <div class="day">16</div>
                    <div class="day">17</div>
                    <div class="day">18</div>
                    <div class="day">19</div>
                    <div class="day">20</div>
                    <div class="day">21</div>
                    <div class="day">22</div>
                    <div class="day">23</div>
                    <div class="day">24</div>
                    <div class="day">25</div>
                    <div class="day">26</div>
                    <div class="day">27</div>
                    <div class="day">28</div>
                    <div class="day">29</div>
                    <div class="day">30</div>
                    <div class="day">31</div>

                    <!-- Empty slots to complete the final row -->
                    <div class="day empty"></div>
                    <div class="day empty"></div>
                    <div class="day empty"></div>
                    <div class="day empty"></div>
                    <div class="day empty"></div>
                </div>
            </div>
        </div>

        <div id="main-card-content" style="visibility: hidden; opacity: 0;">

            <div class="photo-box">

                <!-- thay ảnh của bạn tại đây -->

                <img src="L3.jpg">

            </div>

            <div class="message" id="typing"></div>

            <a class="btn" href="#">
                🌸 Keep Shining 🌸
            </a>

            <div class="music">
                🎵 Happy Birthday
            </div>
        </div>


    </div>

    <!-- nhạc -->

    <audio autoplay muted loop id="hpbd-audio">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>

        /* hiệu ứng gõ chữ */

        const text =
            "Chúc Dì luôn hạnh phúc, thành công và tỏa sáng trên con đường phía trước 💕";

        let index = 0;

        function typeText() {

            if (index < text.length) {

                document.getElementById("typing").innerHTML += text.charAt(index);

                index++;

                setTimeout(typeText, 60);
            }
        }

        typeText();

        /* tạo sao */

        for (let i = 0; i < 80; i++) {

            let star = document.createElement("div");

            star.classList.add("star");

            star.style.left = Math.random() * 100 + "vw";

            star.style.top = Math.random() * 100 + "vh";

            star.style.animationDuration =
                (Math.random() * 3 + 2) + "s";

            document.body.appendChild(star);
        }

        /* tạo tim bay */

        const hearts = ["💖", "💕", "💗", "🌸", "💖",
            "Happy Birthday 🎂",
            "Happy 💕",
            "Success💼",
            "Love you 💖"];

        function createHeart() {

            let heart = document.createElement("div");

            heart.classList.add("heart");
            heart.classList.add("oooh-baby-regular");

            //Lấy ngẫu nhiên 1 phần tử trong mảng hearts

            heart.innerHTML =
                hearts[Math.floor(Math.random() * hearts.length)];
            
            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.animationDuration =
                (Math.random() * 3 + 5) + "s";

            heart.style.fontSize =
                (Math.random() * 20 + 18) + "px";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 70000);
    
        }

        setInterval(createHeart, 500);

    </script>

</body>

</html>
